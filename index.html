<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/render-chain.css">
  <title>View-Dependent Proxy</title>
</head>
<body class="demo-only">
  <main class="demo-shell">
    <header class="demo-header">
      <strong>View-Dependent Proxy</strong>
      <a class="demo-repository-link" href="https://github.com/a-sumo/view-dependent-proxy" aria-label="View source on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.58 2 12.22c0 4.51 2.87 8.34 6.84 9.69.5.1.68-.22.68-.49v-1.91c-2.78.62-3.37-1.21-3.37-1.21-.45-1.19-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.36-2.22-.26-4.56-1.14-4.56-5.05 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05A9.35 9.35 0 0 1 12 6.61c.85 0 1.7.12 2.5.35 1.91-1.32 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.92-2.34 4.79-4.57 5.05.36.32.68.94.68 1.89v3.11c0 .27.18.59.69.49A10.22 10.22 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z" />
        </svg>
        <span>GitHub</span>
      </a>
    </header>

    <section id="render-chain-stage" class="chain-stage" aria-label="Interactive view-dependent object proxy">
      <div class="orientation-panel-backdrop" aria-hidden="true"></div>
      <canvas id="render-chain-canvas" aria-label="Interactive three-dimensional view-dependent proxy"></canvas>

      <button id="labels-toggle" class="labels-toggle" type="button" aria-pressed="false">
        <span>Labels</span>
        <strong id="labels-toggle-state">Off</strong>
      </button>

      <section class="view-controls" aria-label="Selected view angle">
        <label>
          <span>AZIMUTH</span>
          <input id="azimuth-slider" type="range" min="-180" max="180" step="1" value="0">
          <output id="azimuth-slider-value" for="azimuth-slider">+0.0°</output>
        </label>
        <label>
          <span>ELEVATION</span>
          <input id="elevation-slider" type="range" min="0" max="6" step="1" value="5">
          <output id="elevation-slider-value" for="elevation-slider">+0°</output>
        </label>
      </section>

      <div id="label-lens-studio" class="engine-floor-label">AR Engine</div>
      <div id="label-three-js" class="engine-floor-label">Web 3D Engine</div>
      <div id="label-specs" class="scene-label label-specs">SPECS</div>
      <div id="label-runtime-proxy" class="scene-label label-runtime">RUNTIME IMAGE PROXY</div>
      <div id="label-atlas" class="scene-label label-bake">BAKED VIEW SET</div>
      <div id="label-path-camera" class="scene-label label-offline">PATH-TRACING CAMERA</div>
      <div id="label-image-plane" class="scene-label label-offline">SAMPLED IMAGE PLANE</div>
      <div id="label-source-opal" class="scene-label label-offline">3D SOURCE · DIAGRAM CAMERA VIEW</div>
      <div id="label-light" class="scene-label label-offline">LIGHT SOURCE</div>

      <canvas id="offline-camera-view" width="256" height="256" hidden></canvas>
      <output id="atlas-address-value" hidden></output>
      <output id="observer-azimuth-value" hidden></output>
      <output id="chain-stage-value" hidden>Full chain</output>
      <p id="chain-note" hidden></p>
      <div id="chain-loading" class="chain-loading" role="status"><span aria-hidden="true"></span><p>Loading proxy geometry</p></div>
      <div id="chain-error" class="chain-error" hidden><p>Proxy geometry unavailable.</p></div>
    </section>

  </main>
  <script type="module" src="./src/render-chain.js"></script>
</body>
</html>
